    table: classes
    reason: >-
      Public class listing - StudioBook's own class catalog is meant to be
      readable by anyone, logged in or not (see
      supabase/migrations/20240101000002_rls_and_storage.sql,
      classes_select_all). Not one of SPEC.md's seeded B-xx findings.
