# Deliberately insecure for demonstration. Do not deploy.
# Tables where a permissive `using (true)` (or equivalent) policy is
# INTENTIONAL, not a seeded flaw - the checker still reports these (as
# ALLOWLISTED, never silently skipped), it just doesn't count them as FAIL.
# Adding a table here is a reviewable decision, not a code change to the
# checker's classification logic.
allowlist:
