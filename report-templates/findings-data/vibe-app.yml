# Deliberately insecure for demonstration. Do not deploy.
# Per-finding detail for Target B (vibe-app / StudioBook), L5 sample
# deliverables. Severity is genuine analyst judgement; everything that's a
# COUNT or SUMMARY STAT in the generated reports is computed FROM this file
# plus the actual results files (attribution.json), never hand-typed into
# the report body itself (CLAUDE.md). The AI fix prompt shown per finding in
# the generated report is parsed directly from
# targets/vibe-app-fixed/AI_FIX_PROMPTS.md at generation time (see
# generate_reports.py's parse_ai_fix_prompts()) - NOT duplicated here. An
# earlier version of this file DID duplicate each prompt here by hand, and
# it drifted from the real prompts (a milestone review caught this: one
# entry even named a function from the fixed code that didn't exist yet
# when the real prompt was supposedly written). Single source of truth now.

findings:
- id: B-01
  severity: Critical
  owasp_api_2023: API8:2023 - Security Misconfiguration
  owasp_2021: A05:2021 - Security Misconfiguration
  what: The Supabase service-role key (bypasses every RLS policy in the database) is read from a `NEXT_PUBLIC_`-prefixed
    environment variable inside a client component.
  impact: Next.js inlines every `NEXT_PUBLIC_*` variable into the JavaScript bundle shipped to every visitor's
    browser, logged in or not. Anyone who views page source gets a credential that can read or write ANY
    row in the database, unrestricted.
  fix: Move the query behind a server-only route using the service-role client correctly (never in a "use
    client" component); delete the NEXT_PUBLIC_ variable entirely.
  effort: S
- id: B-02
  severity: Critical
  owasp_api_2023: API8:2023 - Security Misconfiguration
  owasp_2021: A02:2021 - Cryptographic Failures
  what: A Stripe secret key is hardcoded directly in a server file, and .env (holding the same value plus
    other credentials) is committed to the repository.
  impact: Anyone with read access to the repository - a contractor, a leaked backup, an over-shared CI
    log - obtains a live-shaped credential that can act as the application against Stripe's API.
  fix: Read the secret from an environment variable with no hardcoded fallback (fail to start if unset);
    add .env to .gitignore and stop committing it.
  effort: S
- id: B-03
  severity: Critical
  owasp_api_2023: API1:2023 - Broken Object Level Authorization
  owasp_2021: A01:2021 - Broken Access Control
  what: Row-level security is never enabled on the bookings table at all.
  impact: Any authenticated user can read, update, or delete EVERY other user's bookings directly through
    Supabase's own REST API, completely bypassing the Next.js app's own routes and any checks they perform.
  fix: Enable RLS with an owner/admin SELECT policy; explicitly revoke INSERT/UPDATE/DELETE from `authenticated`
    - every write must go through a service-role route or RPC, since a policy alone doesn't override Supabase's
    default table-level grants.
  effort: M
- id: B-04
  severity: Critical
  owasp_api_2023: API3:2023 - Broken Object Property Level Authorization
  owasp_2021: A01:2021 - Broken Access Control
  what: RLS IS enabled on profiles, but the SELECT policy is `using (true)` - equivalent to no policy
    at all for reads.
  impact: Every authenticated user can read every other user's profile row, including email and phone
    number - a full customer-PII leak.
  fix: Replace the policy with `id = auth.uid() OR is_admin()`; add a SECURITY DEFINER is_admin() helper
    to avoid the self-referential-policy recursion a plain subquery on profiles would hit.
  effort: S
- id: B-05
  severity: High
  owasp_api_2023: API1:2023 - Broken Object Level Authorization
  owasp_2021: A01:2021 - Broken Access Control
  what: POST /api/bookings/{id}/cancel checks that the caller is logged in, but never checks that the
    booking being cancelled belongs to them.
  impact: Any authenticated user can cancel any OTHER user's booking by id - a denial-of-service against
    a specific victim's reservations.
  fix: Filter the update on id AND user_id (AND status, to make a second cancel a no-op); return the same
    404 whether the booking belongs to someone else or doesn't exist.
  effort: S
- id: B-06
  severity: High
  owasp_api_2023: API5:2023 - Broken Function Level Authorization
  owasp_2021: A01:2021 - Broken Access Control
  what: The admin-only 'grant credits' page hides its form from non-admins in the UI, but the route behind
    it never re-checks the caller's role server-side.
  impact: Any authenticated user can call the route directly and grant themselves - or anyone - unlimited
    free credits, bypassing the studio's entire paid-credit model.
  fix: Add a shared requireAdmin() helper (reads profiles.role via the service-role client, never client-supplied
    data) and call it before doing anything else in the route, returning 403 before even looking up the
    target user.
  effort: S
- id: B-07
  severity: High
  owasp_api_2023: API8:2023 - Security Misconfiguration
  owasp_2021: A08:2021 - Software and Data Integrity Failures
  what: The Stripe webhook handler parses the request body directly with no signature verification at
    all.
  impact: Anyone who knows the webhook URL can POST an arbitrary forged event and have it processed as
    if Stripe sent it - including a fake `checkout.session.completed` that grants free credits (see B-08).
  fix: Verify the raw body against the stripe-signature header with stripe.webhooks.constructEvent() before
    parsing anything; fail closed if the webhook secret is unset.
  effort: S
- id: B-08
  severity: Medium
  owasp_api_2023: API8:2023 - Security Misconfiguration
  owasp_2021: A04:2021 - Insecure Design
  what: The webhook handler has no dedup against the Stripe event's own id - POSTing the identical event
    body twice grants credits twice.
  impact: A replayed (or maliciously resubmitted) webhook event grants the same credits repeatedly - direct
    financial loss for the business, scaling with however many times the event is replayed.
  fix: Record processed event ids in a table with a unique constraint, and grant credits in the SAME atomic
    statement (a SECURITY DEFINER RPC) so there is no window where one succeeded without the other.
  effort: M
- id: B-09
  severity: High
  owasp_api_2023: API8:2023 - Security Misconfiguration
  owasp_2021: A03:2021 - Injection
  what: Avatar upload accepts any file type and size to a public storage bucket; an uploaded SVG with
    an embedded <script> is served back as image/svg+xml with no attachment disposition.
  impact: Stored XSS - a malicious SVG avatar executes its script in the browser of anyone who views it,
    including via the public bucket URL directly.
  fix: Restrict the bucket's allowed_mime_types to a real-image allow-list (no SVG) with a file size cap,
    and derive the stored filename's extension from the validated type, never the raw uploaded filename.
  effort: S
- id: B-10
  severity: Medium
  owasp_api_2023: API4:2023 - Unrestricted Resource Consumption
  owasp_2021: A04:2021 - Insecure Design
  what: The booking route accepts `quantity` with no server-side validation - a negative value is accepted
    and, combined with the duplicated pricing formula (B-12), actually INCREASES the caller's credit balance
    instead of charging them.
  impact: Any authenticated user can generate unlimited free credits for themselves with a single crafted
    request - direct financial loss.
  fix: Validate quantity is a positive integer within a sane bound before it reaches the database; move
    the booking + credit debit into one atomic, capacity/balance-checking database function.
  effort: M
- id: B-11
  severity: Medium
  owasp_api_2023: API3:2023 - Broken Object Property Level Authorization
  owasp_2021: A01:2021 - Broken Access Control
  what: The studio-members server component fetches (and ships to the browser in the React Server Component
    payload) every OTHER member's full profile row, including phone number - the page only ever renders
    their name.
  impact: Any member's browser receives every other member's email and phone number in the page's data
    payload, even though the rendered UI never shows it - trivially recoverable by inspecting network
    traffic.
  fix: Select only the columns the page actually renders ({id, full_name}) - fixing what data is FETCHED,
    not just what's displayed, closes the leak regardless of future rendering changes.
  effort: S
- id: B-12
  severity: Low
  owasp_api_2023: N/A - maintainability, not a security control
  owasp_2021: N/A - maintainability, not a security control
  what: The credit-cost pricing formula is duplicated three times (client display, server charge, admin
    dashboard) with only one copy validating anything; Supabase queries are scattered inline across page
    components; the dashboard page is ~600 lines mixing data-fetching, aggregation and rendering; there
    are zero automated tests.
  impact: Not directly exploitable on its own, but this is exactly the surface where a fix for one bug
    (like B-10's quantity clamp) gets applied to one duplicated copy of the logic and silently missed
    in the others - as it literally did in the baseline.
  fix: One shared, VALIDATING pricing function; one data-access module for the dashboard; the page split
    into small components; tests covering the pricing/validation logic.
  effort: M
