name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deliberately-insecure banners are present
        run: |
          set -euo pipefail
          BANNER="Deliberately insecure for demonstration"
          for f in README.md targets/tenant-api/README.md targets/tenant-api-fixed/README.md targets/vibe-app/README.md docker-compose.yml; do
            grep -q "$BANNER" "$f" || { echo "Missing banner in $f"; exit 1; }
          done

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose config -q
      - name: Build tenant-api images (baseline and fixed)
        run: docker compose build api api-fixed
      - name: Smoke-test postgres service
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d postgres
          for i in $(seq 1 30); do
            health=$(docker compose ps postgres --format '{{.Health}}')
            if [ "$health" = "healthy" ]; then
              echo "postgres is healthy"
              break
            fi
            sleep 2
          done
          docker compose ps postgres --format '{{.Health}}' | grep -q healthy
          docker compose down -v

  tenant-api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test tenant-api
        working-directory: targets/tenant-api
        run: mvn -B verify

  tenant-api-fixed-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test tenant-api-fixed
        working-directory: targets/tenant-api-fixed
        run: mvn -B verify

  vibe-app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: targets/vibe-app/package-lock.json
      - name: Install dependencies
        working-directory: targets/vibe-app
        run: npm ci
      - name: Build (typecheck + compile) - no live Supabase needed
        working-directory: targets/vibe-app
        run: npm run build

  vibe-app-fixed-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: targets/vibe-app-fixed/package-lock.json
      - name: Install dependencies
        working-directory: targets/vibe-app-fixed
        run: npm ci
      - name: Unit tests (lib/pricing, lib/validation) - no live Supabase needed
        working-directory: targets/vibe-app-fixed
        run: npm test
      - name: Build (typecheck + compile) - no live Supabase needed
        working-directory: targets/vibe-app-fixed
        run: npm run build

  scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install semgrep (pinned)
        run: pip install semgrep==1.176.0
      - name: Install scanner script dependencies
        run: pip install PyYAML
      - name: Install rls-checker dependencies (for its own offline unit tests)
        working-directory: scanners/rls-checker
        run: pip install -r requirements.txt
      - name: Run rls-checker's pure classification unit tests (no live DB needed)
        working-directory: scanners/rls-checker
        run: python -m pytest tests/test_classification.py -v
      - name: Verify gitleaks/semgrep/attribution match the expected baseline finding set
        run: python scanners/verify_expected.py

  isolation-tester-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolation-tester dependencies
        working-directory: isolation-tester
        run: pip install -r requirements.txt
      - name: Run offline oracle/exit-code unit tests (no live stack required)
        working-directory: isolation-tester
        run: python -m pytest unit_tests/ -q
